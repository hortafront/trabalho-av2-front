<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CapacitaRH</title>

    <!-- CSS próprio desta página -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login">
        <section class="cartao">

            <!-- CABEÇALHO DO CARTÃO -->
            <header class="cabecalho">
                <a href="index.html" class="logo">Capacita<span>RH</span></a>
                <h1>Acesse o sistema</h1>
            </header>

            <!-- FORMULÁRIO -->
            <form id="form-login" novalidate>
                <div class="campo">
                    <label for="campo-login">Login</label>
                    <input type="text" id="campo-login" autocomplete="username">
                </div>

                <div class="campo">
                    <label for="campo-senha">Senha</label>
                    <input type="password" id="campo-senha" autocomplete="current-password">
                </div>

                <p class="mensagem-erro" id="mensagem-erro" role="alert"></p>

                <button class="botao" type="submit">Entrar</button>
            </form>

            <p class="voltar"><a href="index.html">&larr; Voltar ao início</a></p>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
