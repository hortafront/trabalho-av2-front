<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | CapacitaRH</title>

    <!-- Proteção: sem login, volta para o login antes de mostrar a página -->
    <script src="js/sessao.js"></script>

    <!-- CSS próprio desta página -->
    <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>
    <!-- MENU LATERAL -->
    <aside class="menu" id="menu">
        <a href="dashboard.html" class="logo">Capacita<span>RH</span></a>

        <nav aria-label="Menu principal">
            <ul>
                <li><a href="dashboard.html">Início</a></li>
                <li><a href="usuarios.html" class="ativo" aria-current="page">Usuários</a></li>
                <li><a href="pessoas.html">Pessoas</a></li>
                <li><a href="cadastro2.html">Cadastro 2</a></li>
            </ul>
        </nav>
    </aside>

    <!-- ÁREA DA DIREITA: barra do topo e conteúdo -->
    <div class="pagina">
        <header class="topo">
            <button class="botao-menu" id="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
                <span class="barra"></span>
                <span class="barra"></span>
                <span class="barra"></span>
            </button>

            <p class="ola">Olá, <strong id="nome-usuario">usuário</strong></p>

            <button class="botao-sair" id="botao-sair" type="button">Sair</button>
        </header>

        <main class="conteudo">
            <!-- TÍTULO E BOTÃO NOVO -->
            <div class="cabecalho-pagina">
                <h1>Usuários</h1>
                <button class="botao-novo" id="botao-novo" type="button">+ Novo usuário</button>
            </div>

            <!-- PESQUISA -->
            <div class="pesquisa">
                <label for="campo-pesquisa">Pesquisar</label>
                <input type="search" id="campo-pesquisa" placeholder="Nome ou login">
            </div>

            <!-- LISTAGEM -->
            <section aria-label="Lista de usuários">
                <div class="rolagem">
                    <table class="tabela">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Login</th>
                                <th>Atualizado em</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-tabela">
                            <!-- As linhas são criadas pelo JavaScript -->
                        </tbody>
                    </table>
                </div>

                <p class="vazio" id="mensagem-vazia" hidden>Nenhum usuário encontrado.</p>
            </section>

            <!-- JANELA (MODAL) PARA INCLUIR E EDITAR -->
            <dialog class="janela" id="janela-usuario" aria-labelledby="titulo-janela">
                <form id="form-usuario" novalidate>
                    <header class="janela-topo">
                        <h2 id="titulo-janela">Novo usuário</h2>
                        <button class="botao-fechar" id="botao-fechar" type="button" aria-label="Fechar">&times;</button>
                    </header>

                    <div class="campo">
                        <label for="campo-nome">Nome</label>
                        <input type="text" id="campo-nome" maxlength="200" autofocus>
                    </div>

                    <div class="campo">
                        <label for="campo-login">Login</label>
                        <input type="text" id="campo-login" maxlength="50" autocomplete="off">
                    </div>

                    <div class="campo">
                        <label for="campo-senha">Senha</label>
                        <input type="password" id="campo-senha" autocomplete="new-password">
                    </div>

                    <p class="mensagem-erro" id="mensagem-erro" role="alert"></p>

                    <div class="janela-botoes">
                        <button class="botao-cancelar" id="botao-cancelar" type="button">Cancelar</button>
                        <button class="botao-salvar" type="submit">Salvar</button>
                    </div>
                </form>
            </dialog>
        </main>
    </div>

    <script src="js/usuarios.js"></script>
</body>
</html>
